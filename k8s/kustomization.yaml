apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: java-security

namespace: java-security

resources:
- namespace.yaml
- configmap.yaml
- secret.yaml
- serviceaccount.yaml
- deployment.yaml
- service.yaml
- ingress.yaml
- hpa.yaml
- pdb.yaml
- networkpolicy.yaml
- resourcequota.yaml

commonLabels:
  app: java-security
  managed-by: kustomize

commonAnnotations:
  managed-by: "GitOps"
  environment: "production"

replicas:
- name: java-security
  count: 2

images:
- name: java-security
  newName: your-registry/java-security
  newTag: "1.0.0"

namePrefix: java-security-
nameSuffix: ""

configMapGenerator:
- name: app-config
  files:
  - app.properties

secretGenerator:
- name: db-credentials
  type: Opaque
  literals:
  - db-password=changeme123
