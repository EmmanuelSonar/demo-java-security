name: Helm Lint

on:
  pull_request:
    paths:
      - 'helm/**'
      - '.github/workflows/helm-lint.yml'
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.12.0'

      - name: Lint Helm chart
        run: |
          helm lint ./helm
          helm lint ./helm --strict

      - name: Template rendering check
        run: |
          helm template java-security ./helm > /tmp/rendered.yaml
          echo "Helm chart successfully rendered"

      - name: Validate Kubernetes manifests
        run: |
          helm template java-security ./helm | kubectl apply --dry-run=client -f -
